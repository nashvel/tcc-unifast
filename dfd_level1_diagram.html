        .header {

        }

            font-size: 13px;
        }
        .btn-container {
            margin-top: 10px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            background: #2b6cb0;
            color: white;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .diagram-wrapper {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            max-width: 1700px;
            width: 100%;
            overflow-x: auto;
        }
        svg {
            width: 100%;
            height: auto;
            min-width: 1600px;
            display: block;
        }
        /* Gane & Sarson Styling */
        .entity-box {
            fill: #fff2cc;
            stroke: #000000;
            stroke-width: 1.6;
        }
        .entity-text {
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000;
        }
        .process-head {
            fill: #ffe599;
            stroke: #000000;
            stroke-width: 1.6;
        }
        .process-body {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 1.6;
        }
        .process-num {
            font-size: 13px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000;
        }
        .process-title {
            font-size: 12px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000;
        }
        .store-tag {
            fill: #d9d9d9;
            stroke: #000000;
            stroke-width: 1.5;
        }
        .store-body {
            fill: #fff2cc;
            stroke: #000000;
            stroke-width: 1.5;
        }
        .store-text {
            font-size: 11.5px;
            font-weight: 500;
            dominant-baseline: middle;
            fill: #000;
        }
        .store-tag-text {
            font-size: 12px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000;
        }
        .flow-line {
            stroke: #000000;
            stroke-width: 1.4;
            fill: none;
            marker-end: url(#arrow);
        }
        .flow-line-purple {
            stroke: #7030a0;
            stroke-width: 1.6;
            fill: none;
            marker-end: url(#arrow-purple);
        }
        .flow-label {
            font-size: 10px;
            font-weight: 500;
            fill: #000;
            text-anchor: middle;
            dominant-baseline: middle;
            font-family: Arial, sans-serif;
        }
        .flow-label-purple {
            font-size: 10px;
            font-weight: bold;
            fill: #7030a0;
            text-anchor: middle;
            dominant-baseline: middle;
            font-family: Arial, sans-serif;
        }
        .lbl-bg {
            fill: #ffffff;
            stroke: #cbd5e1;
            stroke-width: 0.8;
            rx: 3;
        }
        .lbl-bg-purple {
            fill: #fdfaff;
            stroke: #c084fc;
            stroke-width: 0.9;

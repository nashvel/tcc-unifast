<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>TCC UniFAST is unavailable</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(28rem, calc(100% - 3rem));
        text-align: center;
      }

      h1 {
        margin-bottom: 0.75rem;
        color: #0f766e;
        font-size: 1.5rem;
      }

      p {
        line-height: 1.6;
      }

      button {
        min-height: 2.75rem;
        margin-top: 1rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #0f766e;
        color: white;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Unable to reach TCC UniFAST</h1>
      <p>Check your internet connection, then try opening the portal again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>

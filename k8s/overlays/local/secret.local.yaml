# Local-cluster secret TEMPLATE. Placeholders only — do not commit real values.
#
# An earlier revision committed a working APP_KEY and n8n encryption key here. Both
# are burned (still in git history) and must never be reused. APP_KEY signs the HMAC
# on the public /api/signed/* document routes, which is their only auth, so a shared
# key means forgeable document URLs.
#
# Fill a local copy that git ignores:
#   cp secret.local.yaml secret.local.generated.yaml
#   # APP_KEY:            php artisan key:generate --show
#   # N8N_ENCRYPTION_KEY: openssl rand -hex 32
#   # then point kustomization.yaml at the generated file
#
# For any deployed environment use a real secret manager (Sealed Secrets, External
# Secrets, SOPS) instead of a file in the repository.
apiVersion: v1
kind: Secret
metadata:
  name: tcc-unifast-secrets
type: Opaque
stringData:
  APP_KEY: "REPLACE_ME_base64_32_bytes"
  DB_USERNAME: "tcc_unifast"
  DB_PASSWORD: "REPLACE_ME_local_db_password"
  MYSQL_ROOT_PASSWORD: "REPLACE_ME_local_root_password"
  N8N_ENCRYPTION_KEY: "REPLACE_ME_openssl_rand_hex_32"
  TCC_UNIFAST_N8N_WEBHOOK_SECRET: ""
  TCC_UNIFAST_SYNC_ENDPOINT_SECRET: ""
  # Shared secret for the OCR microservice (see backend/ocr-service/.env.example).
  OCR_API_KEY: ""

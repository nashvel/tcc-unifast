apiVersion: v1
kind: ConfigMap
metadata:
  name: tcc-unifast-config
data:
  APP_NAME: "TCC UniFAST"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://backend"
  FRONTEND_URL: "http://frontend"
  LOG_CHANNEL: "stderr"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "tcc_unifast"
  SESSION_DRIVER: "database"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MAIL_MAILER: "log"
  OCR_SERVICE_URL: "http://ocr-service:8001"
  OCR_SERVICE_TIMEOUT: "120"
  OCR_SPACE_API_KEY: ""
  OCR_SPACE_TIMEOUT: "60"
  GRADESLIP_QR_TIMEOUT: "60"
  TCC_REGISTRAR_DOMAINS: "registrar.tcc.edu.ph,sis.tcc.edu.ph,tcc.edu.ph"
  VITE_TCC_REGISTRAR_DOMAINS: "registrar.tcc.edu.ph,sis.tcc.edu.ph,tcc.edu.ph"
  FACE_API_PROVIDER: "mock"
  DEV_BYPASS_CAPTCHA: "true"
  LOGIN_THROTTLE_PER_MINUTE: "60"
  VAULT_CONFIRM_THROTTLE_PER_MINUTE: "60"
  TCC_UNIFAST_N8N_WEBHOOK_HEADER: "X-TCC-UniFAST-Key"
  TCC_UNIFAST_N8N_TIMEOUT: "15"
  TCC_UNIFAST_STUDENT_TABLE: "grantees"
  GENERIC_TIMEZONE: "Asia/Manila"
  TZ: "Asia/Manila"
  N8N_HOST: "n8n"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "http"
  N8N_WEBHOOK_URL: "http://n8n:5678/"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: tcc-unifast-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Manila}
      TZ: ${TZ:-Asia/Manila}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      LARAVEL_API_URL: ${LARAVEL_API_URL:-}
      TCC_UNIFAST_N8N_WEBHOOK_SECRET: ${TCC_UNIFAST_N8N_WEBHOOK_SECRET:-}
      TCC_UNIFAST_SYNC_ENDPOINT_SECRET: ${TCC_UNIFAST_SYNC_ENDPOINT_SECRET:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files

  ocr-service:
    build:
      context: ../backend/ocr-service
    container_name: tcc-unifast-ocr-service
    restart: unless-stopped
    ports:
      - "${OCR_SERVICE_PORT:-8001}:8001"
    environment:
      TESSERACT_CMD: /usr/bin/tesseract
      TESSERACT_PSM: ${TESSERACT_PSM:-6}
      SAVE_DEBUG_IMAGES: ${SAVE_DEBUG_IMAGES:-false}
    volumes:
      - ocr_outputs:/app/outputs

volumes:
  n8n_data:
  ocr_outputs:
